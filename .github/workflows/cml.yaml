name: ML CI/CD with CML (Docker)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  cml-docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      # 1. Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. Install CML CLI
      - name: Install CML
        run: npm install -g @dvcorg/cml

      - name: Install DVC
        run: pip install dvc dvc[gdrive]
      - name: Configure DVC remote for Google Drive (OAuth)
        run: |
          # Le remote existe déjà dans .dvc/config (committé dans Git)
          # On vérifie juste qu'il est bien là
          dvc remote list
          
          # Créer le fichier de credentials OAuth à partir des secrets GitHub
          echo '${{ secrets.GDRIVE_CREDENTIALS_JSON }}' > gdrive_user_credentials.json

          
          # Configurer DVC pour utiliser ce fichier (config locale uniquement)
          dvc remote modify --local gdrive_remote gdrive_user_credentials_file gdrive_user_credentials.json
          dvc remote modify --local gdrive_remote gdrive_client_id "${{ secrets.GDRIVE_CLIENT_ID }}"
          dvc remote modify --local gdrive_remote gdrive_client_secret "${{ secrets.GDRIVE_CLIENT_SECRET }}"
          
          # Diagnostic
          echo "=== DVC Remote Configuration ==="
          dvc remote list
          echo "=== DVC Local Config ==="
          dvc config --local --list  
      - name: Pull data & models from DVC remote (Drive)
        run: |
          echo "Pulling data and models from Google Drive..."
          dvc pull -v
      # 3. Build Docker image
      - name: Build Docker image
        run: docker build -t house_price_mlops .

      # 4. Train model inside Docker
      - name: Train model
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/app \
            -w /app \
            house_price_mlops \
            python -m src.train

      # 5. Evaluate model
      - name: Evaluate model
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/app \
            -w /app \
            house_price_mlops \
            python -m src.evaluate

      # 6. Generate plots
      - name: Generate plots
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/app \
            -w /app \
            house_price_mlops \
            python -m src.plots

      # 7. Publish plots to CML
      - name: Publish plot images to CML
        env:
          REPO_TOKEN: ${{ secrets.CML_GH_TOKEN }}
        run: |
          mkdir -p reports
          NEW_PRED=$(cml publish metrics/pred_vs_true.png)
          NEW_RES=$(cml publish metrics/residuals.png)
          echo "NEW_PRED_URL=$NEW_PRED" >> reports/links.env
          echo "NEW_RES_URL=$NEW_RES" >> reports/links.env
      - name: Publish baseline images to CML
        env:
          REPO_TOKEN: ${{ secrets.CML_GH_TOKEN }}
        run: |
          mkdir -p reports
          BASE_PRED=$(cml publish metrics/pred_vs_true_baseline.png)
          BASE_RES=$(cml publish metrics/residuals_baseline.png)
          echo "BASE_PRED_URL=$BASE_PRED" >> reports/links.env
          echo "BASE_RES_URL=$BASE_RES" >> reports/links.env

      # 8. Generate comparison report
      - name: Generate comparison report
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/app \
            -w /app \
            house_price_mlops \
            python -m src.compare

      # 9. Debug - List metrics
      - name: Debug - List metrics
        run: ls -l metrics

      # 10. Post CML comment
      - name: Post CML comment
        env:
          REPO_TOKEN: ${{ secrets.CML_GH_TOKEN }}
        run: |
          cml comment create --publish reports/comparison_report.md
